[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetscope"
version = "0.2.0"
description = "Read Excel workbooks in steps, as an analyst does, with every value cited to its cell."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Alessandro Amaro"}]
readme = "README.md"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
sheetscope = "sheetscope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
